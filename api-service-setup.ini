[Unit]
Description=AsistenciaAPI backend
After=network.target mysql.service

[Service]
User=tdp
WorkingDirectory=/home/userdir/app-asistencia-con-fallas
Environment="PATH=/home/userdir/app-asistencia-con-fallas/.venv/bin"
ExecStart=/home/userdir/app-asistencia-con-fallas/.venv/bin/uvicorn backend.app:app --host 0.0.0.0 --port 80
Restart=always

[Install]
WantedBy=multi-user.target